    <title>CodeOracle - AI-Powered Legacy Code Analyzer</title>
    <meta name="description" content="CodeOracle — AI-powered analysis for legacy Python & JavaScript codebases. Get explanations, tests, refactoring suggestions, and dependency graphs.">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('co-theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
            } catch (e) {
                t = 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
